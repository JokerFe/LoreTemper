[project]
name = "video-tutor"
version = "0.1.0"
description = "Offline, evidence-backed screen recording study assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "watchdog>=6,<7",
    "jieba>=0.42.1,<1",
    "pyyaml>=6,<7",
    "typer>=0.15,<1",
    "markdown-it-py>=3,<5",
    "av>=14,<18",
]

[project.optional-dependencies]
faster = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
video-tutor = "video_tutor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/video_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

